[package]
name = "agt"
version = "0.1.0"
description = "A coding agent for your terminal."
license = "MIT"
authors = ["Joey Chilson"]
repository = "https://github.com/joeychilson/agt"
readme = "README.md"
keywords = ["ai", "agent", "llm", "terminal", "cli"]
categories = ["command-line-utilities", "development-tools"]
include = ["/src", "/tests", "/LICENSE", "/README.md"]
edition = "2024"
rust-version = "1.98"

[dependencies]
base64 = "0.23.1"
crossterm = { version = "0.29.0", default-features = false, features = ["bracketed-paste", "events", "use-dev-tty"] }
dom_query = { version = "0.28.0", default-features = false }
dom_smoothie = "0.18.0"
flate2 = "1.1.10"
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
lexopt = "0.3.2"
percent-encoding = "2.3.2"
pulldown-cmark = { version = "0.13.4", default-features = false }
pty-process = "0.5.3"
ring = "0.17.14"
rustix = { version = "1.1.4", features = ["process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
unicode-width = "0.2.2"
ureq = { version = "3.4.1", default-features = false, features = ["rustls"] }
vt100 = "0.16.2"
vte = "0.15.0"

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
dbg_macro = "deny"
items_after_test_module = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
strip = true
